<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Momentum Transcribe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Momentum Transcribe</h1>

  <div id="dropzone">
    <div id="dropzone-label">Drop an audio file here<br /><span>mp3, m4a, wav</span></div>
  </div>

  <div id="status-area">
    <div id="status-text">Ready</div>
    <div id="progress-track">
      <div id="progress-fill"></div>
    </div>
    <div id="output-path"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
