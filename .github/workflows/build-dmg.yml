name: Build macOS dmg

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-14      # Apple Silicon
            arch: arm64
            builder_flag: --arm64
          - runner: macos-13      # Intel
            arch: x64
            builder_flag: --x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write config.js from secret
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "Missing GROQ_API_KEY repository secret — add it under Settings > Secrets > Actions." >&2
            exit 1
          fi
          cat > config.js <<EOF
          module.exports = { GROQ_API_KEY: "$GROQ_API_KEY" };
          EOF

      - name: Install node deps
        run: npm install

      - name: Build bundled python (PyInstaller)
        run: bash scripts/build_python.sh

      - name: Fetch ffmpeg/ffprobe
        env:
          ARCH: ${{ matrix.arch }}
        run: bash scripts/fetch_ffmpeg.sh

      - name: Build dmg
        run: npx electron-builder --mac ${{ matrix.builder_flag }}

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: momentum-transcribe-${{ matrix.arch }}
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release with dmgs attached
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.dmg
